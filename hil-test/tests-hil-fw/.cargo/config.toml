[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Flashes the bench DUT through probe-rs remote; chip, probe and server come
# from the rig config as BANC_TARGET_* (see ../probe-rs-runner.sh).
runner = "../probe-rs-runner.sh"

[build]
target = "thumbv7em-none-eabi"

[env]
# info: semihosting output halts the core per write; trace-level SPI logs
# would distort radio timing enough to break RX windows.
DEFMT_LOG = "info"
